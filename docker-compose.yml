name: sja-system

x-logging: &default-logging
  driver: local
  options:
    max-size: 20m
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # 202608192148 - 修复了2GB主机上各容器内存上限合计过高导致OOM的问题。
    mem_limit: ${MYSQL_MEMORY_LIMIT:-640m}
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: sja_system_db
      MYSQL_USER: sja
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-192M}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-40}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/sja_system_db_202608131609.sql:/docker-entrypoint-initdb.d/01-schema-data.sql:ro
      - ./sql/20260819_异步任务队列升级.sql:/docker-entrypoint-initdb.d/02-async-task-queue.sql:ro
      # 202609011534 - 新数据卷自动初始化公开注册表单及其可调整时间段。
      - ./sql/20260831_招新注册功能升级.sql:/docker-entrypoint-initdb.d/03-recruitment-form.sql:ro
      - ./sql/20260901_注册时间与自设密码升级.sql:/docker-entrypoint-initdb.d/04-recruitment-schedule.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - internal
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: ${REDIS_MEMORY_LIMIT:-128m}
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-96mb}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory \"$$REDIS_MAXMEMORY\" --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal
    logging: *default-logging

  backend:
    build:
      context: ./SJA_Sys_Java
    restart: unless-stopped
    mem_limit: ${BACKEND_MEMORY_LIMIT:-640m}
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=20 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError}
      SPRING_PROFILES_ACTIVE: prod
      SJA_SERVER_ADDRESS: 0.0.0.0
      SJA_DB_URL: jdbc:mysql://mysql:3306/sja_system_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SJA_DB_USERNAME: sja
      SJA_DB_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      SJA_REDIS_HOST: redis
      SJA_REDIS_PORT: 6379
      SJA_REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      SJA_REDIS_DATABASE: 1
      SJA_JWT_SECRET: ${SJA_JWT_SECRET:?请在 .env 中设置 SJA_JWT_SECRET}
      # 202608192148 - 异步任务正文使用独立密钥加密，避免个人资料明文保存在 Redis。
      SJA_ASYNC_TASK_ENCRYPTION_KEY: ${SJA_ASYNC_TASK_ENCRYPTION_KEY:-}
      # 202609201556 - 留空时后端使用容器HOSTNAME自动生成唯一Redis Stream消费者名称。
      SJA_ASYNC_TASK_CONSUMER_NAME: ${SJA_ASYNC_TASK_CONSUMER_NAME:-}
      SJA_ASYNC_TASK_CONSUMER_LEASE_TTL: ${SJA_ASYNC_TASK_CONSUMER_LEASE_TTL:-90s}
      SJA_ASYNC_TASK_CONSUMER_LEASE_RENEW_INTERVAL: ${SJA_ASYNC_TASK_CONSUMER_LEASE_RENEW_INTERVAL:-30s}
      SJA_ASYNC_TASK_WORKER_COUNT: ${SJA_ASYNC_TASK_WORKER_COUNT:-4}
      SJA_DB_POOL_MAX_SIZE: ${SJA_DB_POOL_MAX_SIZE:-10}
      SJA_TOMCAT_MAX_THREADS: ${SJA_TOMCAT_MAX_THREADS:-80}
      SJA_CORS_ALLOWED_ORIGINS: ${SJA_CORS_ALLOWED_ORIGINS:-http://${SJA_HOST:-192.168.255.128}${WEB_ORIGIN_PORT:-}}
      SJA_REFRESH_COOKIE_SECURE: ${SJA_REFRESH_COOKIE_SECURE:-false}
      # 202608210907 - 将批量注册的令牌有效期和上传限制开放为Compose环境配置。
      SJA_USER_IMPORT_TOKEN_TTL_SECONDS: ${SJA_USER_IMPORT_TOKEN_TTL_SECONDS:-600}
      SJA_USER_IMPORT_MAX_FILE_BYTES: ${SJA_USER_IMPORT_MAX_FILE_BYTES:-2097152}
      SJA_USER_IMPORT_MAX_ROWS: ${SJA_USER_IMPORT_MAX_ROWS:-500}
      SJA_AVATAR_DIR: /app/uploads/avatars
      SJA_TRUSTED_PROXY_REGEX: '10\.\d+\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|192\.168\.\d+\.\d+'
    volumes:
      - avatar_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    logging: *default-logging

  web:
    build:
      context: ./SJA_Sys_Vite
    restart: unless-stopped
    mem_limit: ${WEB_MEMORY_LIMIT:-64m}
    ports:
      - "${SJA_HOST:-192.168.255.128}:${WEB_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - internal
    logging: *default-logging

volumes:
  mysql_data:
  redis_data:
  avatar_data:

networks:
  internal:
    driver: bridge
