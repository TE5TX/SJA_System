name: sja-system

x-logging: &default-logging
  driver: local
  options:
    max-size: 20m
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 1g
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: sja_system_db
      MYSQL_USER: sja
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/sja_system_db_202608131609.sql:/docker-entrypoint-initdb.d/01-schema-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - internal
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal
    logging: *default-logging

  backend:
    build:
      context: ./SJA_Sys_Java
    restart: unless-stopped
    mem_limit: 1g
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SJA_SERVER_ADDRESS: 0.0.0.0
      SJA_DB_URL: jdbc:mysql://mysql:3306/sja_system_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SJA_DB_USERNAME: sja
      SJA_DB_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      SJA_REDIS_HOST: redis
      SJA_REDIS_PORT: 6379
      SJA_REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      SJA_REDIS_DATABASE: 1
      SJA_JWT_SECRET: ${SJA_JWT_SECRET:?请在 .env 中设置 SJA_JWT_SECRET}
      SJA_CORS_ALLOWED_ORIGINS: ${SJA_CORS_ALLOWED_ORIGINS:-http://${SJA_HOST:-192.168.255.128}${WEB_ORIGIN_PORT:-}}
      SJA_REFRESH_COOKIE_SECURE: ${SJA_REFRESH_COOKIE_SECURE:-false}
      # 202608210907 - 将批量注册的令牌有效期和上传限制开放为Compose环境配置。
      SJA_USER_IMPORT_TOKEN_TTL_SECONDS: ${SJA_USER_IMPORT_TOKEN_TTL_SECONDS:-600}
      SJA_USER_IMPORT_MAX_FILE_BYTES: ${SJA_USER_IMPORT_MAX_FILE_BYTES:-2097152}
      SJA_USER_IMPORT_MAX_ROWS: ${SJA_USER_IMPORT_MAX_ROWS:-500}
      SJA_AVATAR_DIR: /app/uploads/avatars
      SJA_TRUSTED_PROXY_REGEX: '10\.\d+\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|192\.168\.\d+\.\d+'
    volumes:
      - avatar_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    logging: *default-logging

  web:
    build:
      context: ./SJA_Sys_Vite
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "${SJA_HOST:-192.168.255.128}:${WEB_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - internal
    logging: *default-logging

volumes:
  mysql_data:
  redis_data:
  avatar_data:

networks:
  internal:
    driver: bridge
