server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sja_system_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: 127.0.0.1
    port: 6379
    database: 1
    timeout: 2s

# 202608121523 - 增加了登录滑块验证码，并使用本机 Redis 保存一次性验证凭证。
captcha:
  prefix: sja:captcha:challenge
  expire:
    default: 120000
  init-default-resource: true
  secondary:
    enabled: true
    expire: 120000
    key-prefix: sja:captcha:login

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.sja.system.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: sja-system-jwt-secret-key-2026-must-be-at-least-256-bits-long
  expiration: 86400000

knife4j:
  enable: true
