server:
  port: ${SJA_SERVER_PORT:8080}
  # 202608140858 - 仅信任 Tomcat 内部代理，防止伪造 X-Forwarded-For 绕过 IP 限流。
  forward-headers-strategy: native
  tomcat:
    # 202608192148 - 修复了突发请求无限占用Web线程并进一步放大数据库压力的问题。
    threads:
      max: ${SJA_TOMCAT_MAX_THREADS:80}
      min-spare: ${SJA_TOMCAT_MIN_SPARE_THREADS:10}
    accept-count: ${SJA_TOMCAT_ACCEPT_COUNT:300}
    max-connections: ${SJA_TOMCAT_MAX_CONNECTIONS:500}
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      internal-proxies: ${SJA_TRUSTED_PROXY_REGEX:127\.\d+\.\d+\.\d+|0:0:0:0:0:0:0:1|::1}

spring:
  datasource:
    url: ${SJA_DB_URL:jdbc:mysql://localhost:3306/sja_system_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SJA_DB_USERNAME}
    password: ${SJA_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 4个写入工作线程预留连接后，其余连接用于登录、状态外的普通查询。
      maximum-pool-size: ${SJA_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${SJA_DB_POOL_MIN_IDLE:2}
      connection-timeout: ${SJA_DB_CONNECTION_TIMEOUT_MS:5000}
  data:
    redis:
      host: ${SJA_REDIS_HOST:127.0.0.1}
      port: ${SJA_REDIS_PORT:6379}
      password: ${SJA_REDIS_PASSWORD:}
      database: ${SJA_REDIS_DATABASE:1}
      timeout: 2s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# 202608121523 - 增加了登录滑块验证码，并使用本机 Redis 保存一次性验证凭证。
captcha:
  prefix: sja:captcha:challenge
  expire:
    default: 120000
  init-default-resource: true
  secondary:
    enabled: true
    expire: 120000
    key-prefix: sja:captcha:login

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.sja.system.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${SJA_JWT_SECRET}
  access-expiration: ${SJA_JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${SJA_JWT_REFRESH_EXPIRATION:604800000}

sja:
  # 202608210907 - 增加了XLSX批量注册预览令牌、文件大小和行数限制。
  user-import:
    key-prefix: ${SJA_USER_IMPORT_KEY_PREFIX:sja:user-import:preview}
    token-ttl-seconds: ${SJA_USER_IMPORT_TOKEN_TTL_SECONDS:600}
    max-file-bytes: ${SJA_USER_IMPORT_MAX_FILE_BYTES:2097152}
    max-rows: ${SJA_USER_IMPORT_MAX_ROWS:500}
  security:
    cors-allowed-origins: ${SJA_CORS_ALLOWED_ORIGINS:http://localhost:5175}
    refresh-cookie-secure: ${SJA_REFRESH_COOKIE_SECURE:false}
    # 202608140858 - 增加了可通过环境变量调整的登录限流与短期锁定参数。
    login-throttle:
      key-prefix: ${SJA_LOGIN_THROTTLE_KEY_PREFIX:sja:security:login}
      account-attempt-limit: ${SJA_LOGIN_ACCOUNT_ATTEMPT_LIMIT:10}
      ip-attempt-limit: ${SJA_LOGIN_IP_ATTEMPT_LIMIT:30}
      attempt-window-seconds: ${SJA_LOGIN_ATTEMPT_WINDOW_SECONDS:300}
      account-failure-limit: ${SJA_LOGIN_ACCOUNT_FAILURE_LIMIT:5}
      ip-failure-limit: ${SJA_LOGIN_IP_FAILURE_LIMIT:20}
      failure-window-seconds: ${SJA_LOGIN_FAILURE_WINDOW_SECONDS:900}
      lock-seconds: ${SJA_LOGIN_LOCK_SECONDS:900}
  upload:
    avatar-dir: ${SJA_AVATAR_DIR:C:/ProgramData/SJA-System/uploads/avatars}
    max-pixels: ${SJA_AVATAR_MAX_PIXELS:20000000}
    max-dimension: ${SJA_AVATAR_MAX_DIMENSION:6000}
    output-dimension: ${SJA_AVATAR_OUTPUT_DIMENSION:1024}
  # 202608192148 - 修复了写入高峰直接冲击 MySQL 的问题，使用 Redis Stream 削峰。
  async-task:
    enabled: ${SJA_ASYNC_TASK_ENABLED:true}
    encryption-key: ${SJA_ASYNC_TASK_ENCRYPTION_KEY:}
    stream-key: ${SJA_ASYNC_TASK_STREAM_KEY:sja:async:write-tasks}
    consumer-group: ${SJA_ASYNC_TASK_CONSUMER_GROUP:sja-write-workers}
    consumer-name: ${SJA_ASYNC_TASK_CONSUMER_NAME:sja-write-worker-1}
    worker-count: ${SJA_ASYNC_TASK_WORKER_COUNT:4}
    worker-queue-capacity: ${SJA_ASYNC_TASK_WORKER_QUEUE_CAPACITY:500}
    queue-capacity: ${SJA_ASYNC_TASK_QUEUE_CAPACITY:5000}
    max-retries: ${SJA_ASYNC_TASK_MAX_RETRIES:2}
    poll-timeout: ${SJA_ASYNC_TASK_POLL_TIMEOUT:1s}
    visibility-timeout: ${SJA_ASYNC_TASK_VISIBILITY_TIMEOUT:5m}
    status-ttl: ${SJA_ASYNC_TASK_STATUS_TTL:24h}
    processing-lock-ttl: ${SJA_ASYNC_TASK_PROCESSING_LOCK_TTL:6m}
    recovery-interval-ms: ${SJA_ASYNC_TASK_RECOVERY_INTERVAL_MS:30000}
    recovery-initial-delay-ms: ${SJA_ASYNC_TASK_RECOVERY_INITIAL_DELAY_MS:30000}

knife4j:
  enable: ${SJA_API_DOCS_ENABLED:false}
springdoc:
  api-docs:
    enabled: ${SJA_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SJA_API_DOCS_ENABLED:false}

logging:
  level:
    com.baomidou.mybatisplus: warn
    org.mybatis: warn
