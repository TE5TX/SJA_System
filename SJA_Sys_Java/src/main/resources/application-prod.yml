# 生产环境必须显式提供真实域名：SPRING_PROFILES_ACTIVE=prod
server:
  address: ${SJA_SERVER_ADDRESS:127.0.0.1}
  forward-headers-strategy: framework

sja:
  security:
    cors-allowed-origins: ${SJA_CORS_ALLOWED_ORIGINS}
    refresh-cookie-secure: true
  upload:
    avatar-dir: ${SJA_AVATAR_DIR:C:/ProgramData/SJA-System/uploads/avatars}

knife4j:
  enable: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
