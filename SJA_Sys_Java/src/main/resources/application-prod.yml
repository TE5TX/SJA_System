# 生产环境必须显式提供真实域名：SPRING_PROFILES_ACTIVE=prod
server:
  address: ${SJA_SERVER_ADDRESS:127.0.0.1}
  # 202608140858 - 生产环境仅信任配置的内部反向代理转发客户端地址。
  forward-headers-strategy: native

sja:
  security:
    cors-allowed-origins: ${SJA_CORS_ALLOWED_ORIGINS}
    # 局域网 IP + HTTP 部署时可显式设为 false；启用 HTTPS 后必须设为 true。
    refresh-cookie-secure: ${SJA_REFRESH_COOKIE_SECURE:true}
  upload:
    avatar-dir: ${SJA_AVATAR_DIR:C:/ProgramData/SJA-System/uploads/avatars}

knife4j:
  enable: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
